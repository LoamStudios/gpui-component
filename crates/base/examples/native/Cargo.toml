[package]
name = "gpui-base-examples"
default-run = "components"
version = "0.7.0"
publish = false
edition.workspace = true

[dependencies]
anyhow.workspace = true
chrono = "0.4.38"
gpui.workspace = true
gpui-base = { workspace = true }
gpui_platform.workspace = true
futures.workspace = true
http = "1"
log.workspace = true
reqwest.workspace = true
syntect.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# The shared showcase is included with `#[path]`, which cargo-machete cannot
# follow when detecting its `chrono`, `gpui`, `gpui_base`, and `syntect` imports.
[package.metadata.cargo-machete]
ignored = ["chrono", "gpui", "gpui-base", "syntect"]
