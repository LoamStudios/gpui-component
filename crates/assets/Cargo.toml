[package]
name = "gpui_ce_components_assets"
description = "Default bundled assets for GPUI Component."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license.workspace = true
documentation = "https://docs.rs/gpui_ce_components_assets"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
edition.workspace = true
publish = true
version.workspace = true

# Retain Cargo icon-directory metadata for existing build-script consumers.
links = "gpui-kit-default-icons"

[lib]
name = "gpui_component_assets"
doctest = false

[dependencies]
anyhow.workspace = true
gpui.workspace = true
log.workspace = true

[dev-dependencies]
gpui_platform.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8.7.2", features = [
  "interpolate-folder-path",
  "include-exclude",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { version = "0.13", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
